name: release

# Creates a GitHub Release from a version tag (vX.Y.Z); a manual run must select that tag as its ref, after the full CI matrix passes.
# The tag must equal the product version in CodeShield.Mcp.csproj and the plugin manifests, and CHANGELOG.md
# must have a section for it (scripts/check-release.ps1). NuGet publishing is intentionally not wired up:
# it needs an explicit package identity, API key and an owner decision, and then a separate job here.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - id: meta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (scripts/check-release.ps1 -Tag $env:RELEASE_TAG | Select-Object -Last 1)
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

  verify:
    needs: validate
    uses: ./.github/workflows/package.yml

  release:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CodeShield.Tool-ubuntu-latest
          path: dist
      - name: Checksums and release notes
        shell: pwsh
        run: |
          scripts/check-release.ps1 -Tag '${{ needs.validate.outputs.tag }}' -NotesPath dist/notes.md
          Get-ChildItem dist -Filter *.nupkg | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" | Out-File dist/SHA256SUMS.txt -Append -Encoding ascii
          }
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease";; esac
          gh release create "$TAG" dist/CodeShield.Tool.*.nupkg dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "CodeShield $TAG" --notes-file dist/notes.md $prerelease
