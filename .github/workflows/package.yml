name: package

# Builds, tests and verifies the tool package on every supported OS/architecture. Nothing is published here.
# Also reusable by the release workflow so a release is exactly what CI verified.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: microsoft
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Download detekt-cli 1.23.8 for the Kotlin tests (CI only; users install their own)
        shell: pwsh
        run: scripts/fetch-detekt.ps1 -Version 1.23.8 -Destination $env:RUNNER_TEMP -ExportToGitHubEnv
      - name: Release metadata is consistent
        shell: pwsh
        run: scripts/check-release.ps1
      - name: Build
        run: dotnet build CodeShield.slnx -c Release
      - name: Core unit tests
        run: dotnet test tests/CodeShield.Core.Tests -c Release --no-build
      - name: C# analyzer tests
        run: dotnet test tests/CodeShield.CSharp.Tests -c Release --no-build
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: TypeScript worker tests
        working-directory: worker
        run: npm test
      - name: Build TypeScript worker (used by the integration tests from the source tree)
        working-directory: worker
        run: npm run build
      - name: Kotlin worker tests and jar (the jar is used by the integration tests from the source tree)
        working-directory: kotlin-worker
        shell: pwsh
        run: if ($IsWindows) { ./gradlew.bat build --no-daemon } else { sh ./gradlew build --no-daemon }
      - name: Integration tests (real MCP server over stdio, fixture Git repositories)
        run: dotnet test tests/CodeShield.IntegrationTests -c Release --no-build
      - name: Pack, install into a temporary tool path and run the 4 installed-package tests (tool and notices)
        shell: pwsh
        run: scripts/verify-install.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodeShield.Tool-${{ matrix.os }}
          path: artifacts/feed/CodeShield.Tool.*.nupkg
          if-no-files-found: error
          retention-days: 14

  # The worker is compiled against the oldest supported detekt-cli; this keeps every 1.23.x release, not only the newest, working.
  detekt-compatibility:
    name: Kotlin against detekt-cli 1.23.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: microsoft
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Download detekt-cli 1.23.0
        shell: pwsh
        run: scripts/fetch-detekt.ps1 -Version 1.23.0 -Destination $env:RUNNER_TEMP -ExportToGitHubEnv
      - name: Kotlin worker tests against detekt-cli 1.23.0
        working-directory: kotlin-worker
        run: sh ./gradlew build --no-daemon -PdetektVersion=1.23.0
      - name: Build
        run: dotnet build CodeShield.slnx -c Release
      - name: Kotlin integration tests against detekt-cli 1.23.0
        run: dotnet test tests/CodeShield.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~Kotlin"
